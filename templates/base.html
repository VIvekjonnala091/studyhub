<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#4657e8"><title>{% block title %}StudyHub{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><header><a class="brand" href="{{ url_for('home') }}"><span>◈</span> StudyHub</a><button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false" onclick="toggleMenu()">☰</button><nav id="main-nav"><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('class_page',grade=9) }}">Class 9</a><a href="{{ url_for('class_page',grade=10) }}">Class 10</a><a href="{{ url_for('announcements') }}">Announcements</a></nav><a class="admin-link" href="{{ url_for('admin') }}">Admin</a></header><main>{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-wrap">{% for cat,msg in messages %}<div class="flash {{cat}}">{{msg}}</div>{% endfor %}</div>{% endif %}{% endwith %}{% block content %}{% endblock %}</main><footer>StudyHub · Classes 9 & 10 · Artificial Intelligence</footer><script>function toggleMenu(){const n=document.getElementById('main-nav'),b=document.querySelector('.menu-toggle');n.classList.toggle('open');b.setAttribute('aria-expanded',n.classList.contains('open'))}document.querySelectorAll('#main-nav a').forEach(a=>a.addEventListener('click',()=>document.getElementById('main-nav').classList.remove('open')));</script></body></html>
